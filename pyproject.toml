[project]
name = "rolebreak"
version = "0.1.0"
description = "A harness for benchmarking role consistency in speech-to-speech models."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }

dependencies = [
    "aiohttp>=3.10",          # every *-api backend talks HTTP/WebSocket over this
    "click>=8.1",             # CLI for tools/ and rolebreak.voices
    "funasr>=1.2",            # emotion2vec, behind the emotion metric
    "huggingface-hub>=0.30",  # pulls the role library and the voice banks
    "librosa>=0.10,<1",   # UTMOSv2 predates the 1.0 API
    "numpy>=1.26",
    "openai>=1.60",           # vLLM/OpenAI-compatible endpoints + the text_quality judge
    "pre-commit>=4.0",
    "pyarrow>=15",            # voice banks ship as parquet
    "ruff==0.14.6",           # keep in step with the ruff-pre-commit rev in .pre-commit-config.yaml
    "scoreq>=1.0",            # second opinion on naturalness
    "soundfile>=0.12",
    "sphn>=0.1.4",            # Opus framing for the Moshi/PersonaPlex/pipeline backends
    "timm>=1.0",              # UTMOSv2 backbone
    "torch>=2.8,<3",
    "torchaudio>=2.8,<3",
    "tqdm>=4.66",
    "transformers>=4.45,<5",  # funasr/UTMOSv2 are not 5.x-ready
    "ty>=0.0.1a1",
    "webdataset>=0.2",        # synthesized user turns are stored as wds shards
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# tools/ is part of the harness -- the eval entry points are `python -m tools.eval.*`.
packages = ["rolebreak", "tools"]

[tool.ruff]
# Ruff config reference: https://docs.astral.sh/ruff/configuration/
#
# Line length of 120 characters (as documented in toolchain.md)
# This setting applies to both ruff linting and formatting, and is automatically
# picked up by pre-commit hooks and IDE extensions (e.g., Ruff VS Code extension)
line-length = 120
exclude = ["external/"]

[tool.ty.src]
# ty config reference: https://docs.astral.sh/ty/configuration/#configuration-files
# exclusions reference: https://docs.astral.sh/ty/exclusions/
include = ["rolebreak", "scripts"]
# scripts/s2s_mock/ runs inside the speech-pipeline container and imports
# speech_to_speech, which is not installed here -- same reason external/ is out.
exclude = ["**/build/", "**/dist/", "**/.venv/", "**/vendor/", "external/", "scripts/s2s_mock/"]
